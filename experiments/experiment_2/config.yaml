experiment_id: 2
name: pneumonia_vs_normal

data:
  path: data/raw/xray_dataset_covid19/train
  image_size: 224

model:
  name: ViT-B/32
  pretrained: true

inference:
  batch_size: 8

input_texts:
  - "a radiology chest x-ray of a healthy patient"
  - "a radiology image showing pneumonia in the lungs"

output_range: # 需要与两个文件夹的名字保持一致
  - "NORMAL"
  - "PNEUMONIA"